<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Präsis">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<title>Präsentationen</title>
<style>
  /* Aufbau wie die iOS-Einstellungen: großer Titel, gruppierte Listen mit Symbol, Untertitel und Pfeil */
  :root {
    --bg: #f2f2f7;
    --cell: #ffffff;
    --cell-pressed: #e5e5ea;
    --label: #000000;
    --secondary: rgba(60, 60, 67, .6);
    --separator: rgba(60, 60, 67, .29);
    --chevron: rgba(60, 60, 67, .3);
    --gray: #8e8e93;
    --blue: #007aff;
    --indigo: #5856d6;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --cell: #1c1c1e;
      --cell-pressed: #2c2c2e;
      --label: #ffffff;
      --secondary: rgba(235, 235, 245, .6);
      --separator: rgba(84, 84, 88, .65);
      --chevron: rgba(235, 235, 245, .3);
      --gray: #8e8e93;
      --blue: #0a84ff;
      --indigo: #5e5ce6;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--label);
    font: 17px/1.29 var(--font);
    letter-spacing: -.41px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 44px)
      max(16px, env(safe-area-inset-right, 0px))
      calc(env(safe-area-inset-bottom, 0px) + 40px)
      max(16px, env(safe-area-inset-left, 0px));
  }

  h1 {
    margin: 0 0 22px 4px;
    font-size: 34px;
    line-height: 41px;
    font-weight: 700;
    letter-spacing: .37px;
  }

  section + section { margin-top: 35px; }
  h2 {
    margin: 0 0 7px 16px;
    font-size: 13px;
    line-height: 18px;
    font-weight: 400;
    letter-spacing: -.08px;
    text-transform: uppercase;
    color: var(--secondary);
  }
  .footnote {
    margin: 7px 16px 0;
    font-size: 13px;
    line-height: 18px;
    letter-spacing: -.08px;
    color: var(--secondary);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--cell);
    border-radius: 10px;
    overflow: hidden;
  }
  li { position: relative; }
  li + li::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 60px;
    border-top: .5px solid var(--separator);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 60px;
    padding: 9px 16px;
    color: inherit;
    text-decoration: none;
    transition: background-color .15s;
  }
  a.row:active { background: var(--cell-pressed); transition: none; }
  a.row:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; border-radius: 10px; }

  .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 29px;
    height: 29px;
    border-radius: 7px;
    color: #fff;
    background: var(--gray);
  }
  .icon svg { width: 18px; height: 18px; }
  .icon.blue { background: var(--blue); }
  .icon.indigo { background: var(--indigo); }

  .text { flex: 1; min-width: 0; }
  .title { display: block; }
  .subtitle {
    display: block;
    margin-top: 1px;
    font-size: 15px;
    line-height: 20px;
    letter-spacing: -.24px;
    color: var(--secondary);
  }
  .value {
    flex: none;
    color: var(--secondary);
    font-variant-numeric: tabular-nums;
  }
  .chevron { flex: none; width: 8px; height: 14px; color: var(--chevron); }

  .info .row { min-height: 44px; }

  @media (prefers-reduced-motion: reduce) { .row { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Präsentationen</h1>

  <section aria-labelledby="asml">
    <h2 id="asml">ASML · Die Maschine hinter jedem Chip</h2>
    <ul>
      <li>
        <a class="row" href="asml/">
          <span class="icon blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>
          </span>
          <span class="text">
            <span class="title">Fassung 1</span>
            <span class="subtitle">Kompakt, große Zahlen</span>
          </span>
          <span class="value">9 Folien</span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>
      </li>
      <li>
        <a class="row" href="asml-guizang/">
          <span class="icon indigo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 12l3-3 3 2 4-4"/><path d="M12 16v4M8 20h8"/></svg>
          </span>
          <span class="text">
            <span class="title">Fassung 2</span>
            <span class="subtitle">Ausführlich</span>
          </span>
          <span class="value">11 Folien</span>
          <svg class="chevron" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>
        </a>
      </li>
    </ul>
    <p class="footnote">Halte das iPhone quer, dann füllen die Folien den ganzen Bildschirm.</p>
  </section>

  <section aria-labelledby="bedienung">
    <h2 id="bedienung">Bedienung</h2>
    <ul class="info">
      <li>
        <div class="row">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
          <span class="text"><span class="title">Weiter</span></span>
          <span class="value">Nach links wischen</span>
        </div>
      </li>
      <li>
        <div class="row">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          </span>
          <span class="text"><span class="title">Zurück</span></span>
          <span class="value">Nach rechts wischen</span>
        </div>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
